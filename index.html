<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Desktop Ren'Py Emulator</title>
    <!-- Loads the extraction engine entirely offline from your repository -->
    <script src="jszip.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: url('images (1).png') no-repeat center center fixed; 
            background-size: cover;
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            overflow: hidden;
        }

        .main-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            z-index: 10;
        }

        .side-gif {
            width: 150px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0px 8px 16px rgba(0, 0, 0, 0.4));
            user-select: none;
            -webkit-user-drag: none;
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            width: 420px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            transition: all 0.4s ease;
        }

        #drop-zone { 
            border: 2px dashed rgba(255, 255, 255, 0.4); 
            border-radius: 12px; 
            width: 100%; 
            padding: 30px 0; 
            cursor: pointer; 
            transition: background 0.3s, border-color 0.3s;
        }
        #drop-zone:hover { 
            border-color: #007bff; 
            background: rgba(255, 255, 255, 0.05); 
        }

        h3, p { margin: 5px 0; color: white; }
        p { font-size: 0.9em; opacity: 0.8; }

        #loading-container { 
            display: none; 
            width: 100%;
        }

        #loading-text { 
            font-size: 1.1em; 
            margin-bottom: 12px; 
            font-weight: 500;
            color: white;
        }

        .progress-bar-wrapper {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            width: 100%;
            height: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #007bff, #00d2ff);
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        /* Hidden area for game engine display canvas wrapper */
        #game-container { 
            display: none; 
            width: 100%; 
            height: 100vh; 
            position: absolute; 
            top: 0; 
            left: 0; 
            background: black; 
            z-index: 9999;
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="main-layout" id="interactive-ui">
        
        <img src="polish-cow-cow.gif" alt="Dancing Cow" class="side-gif">

        <div class="glass-box" id="ui-box">
            <div id="drop-zone" onclick="document.getElementById('file-input').click()">
                <h3>Drag & Drop Desktop ZIP</h3>
                <p>Drop a standard Windows/Mac Ren'Py game folder</p>
                <input type="file" id="file-input" accept=".zip" style="display:none">
            </div>
            
            <div id="loading-container">
                <div id="loading-text">Preparing extraction engine...</div>
                <div class="progress-bar-wrapper">
                    <div id="progress-bar"></div>
                </div>
            </div>
        </div>

        <img src="polish-cow-cow.gif" alt="Dancing Cow" class="side-gif">

    </div>
    
    <div id="game-container"><iframe id="game-frame" name="game-frame"></iframe></div>

    <script>
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const interactiveUi = document.getElementById('interactive-ui');
        const loadingContainer = document.getElementById('loading-container');
        const loadingText = document.getElementById('loading-text');
        const progressBar = document.getElementById('progress-bar');
        const container = document.getElementById('game-container');
        const frame = document.getElementById('game-frame');

        fileInput.addEventListener('change', (e) => handleDesktopZip(e.target.files));

        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length > 0) {
                handleDesktopZip(e.dataTransfer.files);
            }
        });

        async function handleDesktopZip(fileList) {
            const file = fileList[0];
            if (!file || !file.name.endsWith('.zip')) {
                alert("Please drop a valid desktop .zip archive.");
                return;
            }

            dropZone.style.display = 'none';
            loadingContainer.style.display = 'block';
            loadingText.innerText = "Scanning desktop zip directories...";
            progressBar.style.width = "5%";

            try {
                const zip = await JSZip.loadAsync(file);
                
                // Track down the game folder location dynamically
                let prefix = "";
                const sampleKey = Object.keys(zip.files).find(k => k.includes("/game/options.rpyc") || k.endsWith("game/options.rpyc"));
                
                if (sampleKey) {
                    prefix = sampleKey.substring(0, sampleKey.indexOf("game/"));
                } else if (!zip.files["game/"] && !Object.keys(zip.files).some(k => k.startsWith("game/"))) {
                    throw new Error("Could not find a valid Ren'Py 'game' directory structure inside this ZIP file.");
                }

                loadingText.innerText = "Extracting desktop scripts & game structures...";
                progressBar.style.width = "20%";

                // We read and bundle only the 'game/' contents into a virtual game.data blob
                const gameZip = new JSZip();
                const allEntries = Object.entries(zip.files).filter(([filename, entry]) => !entry.dir && filename.startsWith(prefix + "game/"));
                const totalFiles = allEntries.length;
                
                let processedFiles = 0;

                for (const [filename, zipEntry] of allEntries) {
                    const relativePath = filename.replace(prefix, "");
                    const fileBlob = await zipEntry.async("blob");
                    gameZip.file(relativePath, fileBlob);
                    
                    processedFiles++;
                    let progressPercent = 20 + Math.floor((processedFiles / totalFiles) * 60);
                    progressBar.style.width = progressPercent + "%";
                }

                loadingText.innerText = "Building standalone web runtime context...";
                progressBar.style.width = "85%";
                
                const gameDataBlob = await gameZip.generateAsync({ type: "blob" });
                const gameDataUrl = URL.createObjectURL(gameDataBlob);

                // Build a dynamic local boot document that launches renpy.js completely offline
                const bootHtmlContent = `
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>RenPy Engine Sandbox</title>
    <style>
        body, canvas { background: black; width: 100vw; height: 100vh; margin: 0; padding: 0; overflow: hidden; }
        canvas { display: block; margin: auto; }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <script>
        window.windowHeight = window.innerHeight;
        window.windowWidth = window.innerWidth;
        
        var Module = {
            canvas: document.getElementById('canvas'),
            arguments: ["/web-py"], 
            print: console.log,
            printErr: console.error,
            locateFile: function(path) {
                if (path === "renpy.wasm") return window.location.origin + "/renpy.wasm";
                return path;
            },
            postRun: [function() {
                console.log("WebAssembly runtime launched successfully.");
            }]
        };

        fetch("${gameDataUrl}")
        .then(res => res.blob())
        .then(blob => {
            Module.gameDataBlob = blob;
            var script = document.createElement('script');
            script.src = window.location.origin + "/renpy.js";
            document.body.appendChild(script);
        });
    <\/script>
</body>
</html>
`;

                const bootHtmlBlob = new Blob([bootHtmlContent], { type: "text/html" });
                const bootHtmlUrl = URL.createObjectURL(bootHtmlBlob);

                progressBar.style.width = "100%";
                setTimeout(() => {
                    interactiveUi.style.display = 'none';
                    container.style.display = 'block';
                    frame.src = bootHtmlUrl;
                }, 400);

            } catch (err) {
                alert("Error during virtualization: " + err.message);
                location.reload();
            }
        }
    </script>
</body>
</html>

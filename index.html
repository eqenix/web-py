<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Browser Ren'Py Zip Loader</title>
    <!-- We load JSZip to parse the zip folder completely inside the client browser -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #drop-zone { border: 3px dashed #444; border-radius: 20px; width: 400px; padding: 50px; text-align: center; cursor: pointer; transition: 0.3s; }
        #drop-zone:hover { border-color: #007bff; background: #1a1a1a; }
        #game-container { display: none; width: 100%; height: 100vh; position: absolute; top: 0; left: 0; background: black; }
        iframe { width: 100%; height: 100%; border: none; }
        #loading { display: none; font-size: 1.2em; color: #007bff; }
    </style>
</head>
<body>

    <div id="drop-zone" onclick="document.getElementById('file-input').click()">
        <h3>Drag & Drop your Ren'Py Web ZIP here</h3>
        <p>or click to browse your files</p>
        <input type="file" id="file-input" accept=".zip" style="display:none">
    </div>
    
    <div id="loading">Unzipping and assembling game assets in memory...</div>
    <div id="game-container"><iframe id="game-frame"></iframe></div>

    <script>
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const loading = document.getElementById('loading');
        const container = document.getElementById('game-container');
        const frame = document.getElementById('game-frame');

        fileInput.addEventListener('change', (e) => handleZip(e.target.files[0]));

        async function handleZip(file) {
            if (!file) return;
            dropZone.style.display = 'none';
            loading.style.display = 'block';

            const zip = await JSZip.loadAsync(file);
            const files = {};
            
            // Extract files into Object URLs so the browser can execute them locally
            for (const [filename, zipEntry] of Object.entries(zip.files)) {
                if (zipEntry.dir) continue;
                const blob = await zipEntry.async("blob");
                
                // Set the proper MIME Type for the extracted WebAssembly binary
                let type = "application/octet-stream";
                if (filename.endsWith(".html")) type = "text/html";
                if (filename.endsWith(".js")) type = "application/javascript";
                if (filename.endsWith(".wasm")) type = "application/wasm";
                
                const typedBlob = new Blob([blob], { type: type });
                files[filename] = URL.createObjectURL(typedBlob);
            }

            // Look for the main index file in the root or nested directory
            const mainHtmlKey = Object.keys(files).find(k => k.endsWith('index.html'));
            
            if (mainHtmlKey) {
                loading.style.display = 'none';
                container.style.display = 'block';
                
                // Inject the generated memory context directly into the iframe
                frame.src = files[mainHtmlKey];
            } else {
                alert("Invalid Zip. Please make sure you are dropping a compiled Ren'Py WEB build!");
                location.reload();
            }
        }
    </script>
</body>
</html>

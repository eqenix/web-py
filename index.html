<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Desktop Ren'Py Emulator</title>
    <script src="jszip.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: url('images (1).png') no-repeat center center fixed; 
            background-size: cover;
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            overflow: hidden;
        }
        .main-layout { display: flex; align-items: center; justify-content: center; gap: 40px; z-index: 10; }
        .side-gif { width: 150px; height: auto; object-fit: contain; filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.4)); }
        .glass-box { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 40px; width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        #drop-zone { border: 2px dashed rgba(255, 255, 255, 0.4); border-radius: 12px; width: 100%; padding: 30px 0; cursor: pointer; }
        #drop-zone:hover { border-color: #007bff; background: rgba(255, 255, 255, 0.05); }
        #loading-container { display: none; width: 100%; }
        #loading-text { font-size: 1.1em; margin-bottom: 12px; font-weight: 500; color: white; }
        .progress-bar-wrapper { background: rgba(255, 255, 255, 0.15); border-radius: 10px; width: 100%; height: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        #progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #007bff, #00d2ff); border-radius: 10px; transition: width 0.1s linear; }
        #game-container { display: none; width: 100%; height: 100vh; position: absolute; top: 0; left: 0; background: black; z-index: 9999; }
        #canvas { display: block; margin: auto; width: 100vw; height: 100vh; background: black; }
    </style>
</head>
<body>

    <div class="main-layout" id="interactive-ui">
        <img src="polish-cow-cow.gif" alt="Dancing Cow" class="side-gif">
        <div class="glass-box" id="ui-box">
            <div id="drop-zone" onclick="document.getElementById('file-input').click()">
                <h3>Drag & Drop Desktop ZIP</h3>
                <p>Drop a standard Windows/Mac Ren'Py game folder</p>
                <input type="file" id="file-input" accept=".zip" style="display:none">
            </div>
            <div id="loading-container">
                <div id="loading-text">Preparing extraction engine...</div>
                <div class="progress-bar-wrapper">
                    <div id="progress-bar"></div>
                </div>
            </div>
        </div>
        <img src="polish-cow-cow.gif" alt="Dancing Cow" class="side-gif">
    </div>
    
    <div id="game-container"><canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas></div>
    <script>
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const interactiveUi = document.getElementById('interactive-ui');
        const loadingContainer = document.getElementById('loading-container');
        const loadingText = document.getElementById('loading-text');
        const progressBar = document.getElementById('progress-bar');
        const container = document.getElementById('game-container');

        fileInput.addEventListener('change', (e) => { if (e.target.files.length > 0) handleDesktopZip(e.target.files); });

        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length > 0) {
                handleDesktopZip(e.dataTransfer.files);
            }
        });

        async function handleDesktopZip(fileList) {
            const file = fileList[0];
            if (!file || !file.name.endsWith('.zip')) {
                alert("Please drop a valid desktop .zip archive.");
                return;
            }

            dropZone.style.display = 'none';
            loadingContainer.style.display = 'block';
            loadingText.innerText = "Parsing archive headers...";
            progressBar.style.width = "5%";

            try {
                const zip = await JSZip.loadAsync(file);
                
                let prefix = "";
                const sampleKey = Object.keys(zip.files).find(k => k.includes("/game/options.rpyc") || k.endsWith("game/options.rpyc"));
                if (sampleKey) {
                    prefix = sampleKey.substring(0, sampleKey.indexOf("game/"));
                }

                loadingText.innerText = "Extracting app assets...";
                progressBar.style.width = "20%";

                window.virtualFileSystemMap = {};
                const targetEntries = Object.entries(zip.files).filter(([filename, entry]) => !entry.dir);
                const totalFiles = targetEntries.length;
                
                let processedFiles = 0;

                for (const [filename, zipEntry] of targetEntries) {
                    const cleanPath = filename.replace(prefix, "");
                    const fileArrayBuffer = await zipEntry.async("uint8array");
                    window.virtualFileSystemMap[cleanPath] = fileArrayBuffer;
                    
                    processedFiles++;
                    let progressPercent = 20 + Math.floor((processedFiles / totalFiles) * 65);
                    progressBar.style.width = progressPercent + "%";
                }

                loadingText.innerText = "Mounting isolated execution layers...";
                progressBar.style.width = "90%";

                window.windowHeight = window.innerHeight;
                window.windowWidth = window.innerWidth;
                
                // Build a secure property protection interceptor to stop renpy.js from resetting arguments
                let baselineArguments = ["/home/pyodide/main.py"];
                let protectedModule = {
                    canvas: document.getElementById('canvas'),
                    print: console.log,
                    printErr: console.error,
                };
                
                // Create a reactive proxy wrapper that intercepts any external file-path overrides
                window.Module = new Proxy(protectedModule, {
                    get: function(target, prop) {
                        if (prop === 'arguments') return baselineArguments;
                        return target[prop];
                    },
                    set: function(target, prop, value) {
                        if (prop === 'arguments') {
                            console.log("Blocked a destructive path reset attempt from engine core: ", value);
                            return true; // Completely reject the overwrite and pretend it succeeded
                        }
                        target[prop] = value;
                        return true;
                    }
                });
                
                // Now define the rest of your system setup parameters securely onto the protected target
                protectedModule.locateFile = function(path) {
                    if (path === "renpy.wasm") return window.location.origin + "/renpy.wasm";
                    return path;
                };
                
                protectedModule.preRun = [function() {
                    locateFile: function(path) {
                        if (path === "renpy.wasm") return window.location.origin + "/renpy.wasm";
                        return path;
                    },
                    preRun: [function() {
                        console.log("Initializing dynamic virtual folder injection layout...");

                        try {
                            // Enforce home architecture paths natively
                            try { Module.FS.mkdir('/home'); } catch(e){}
                            try { Module.FS.mkdir('/home/pyodide'); } catch(e){}

                            // Build a valid empty zip format chunk to verify native headers
                            const validEmptyZipBytes = new Uint8Array([
                                0x50, 0x4B, 0x05, 0x06, 0x00, 0x00, 0x00, 0x00, 
                                0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 
                                0x00, 0x00, 0x00, 0x00, 0x00, 0x00             
                            ]);
                            Module.FS.createDataFile('/', 'game.zip', validEmptyZipBytes, true, true, true);

                            // Write extracted game files directly into the virtual storage sandbox space
                            for (const [vPath, u8Array] of Object.entries(window.virtualFileSystemMap)) {
                                const targetPath = '/home/pyodide/' + vPath;
                                
                                // Direct folder mapping safety handler
                                let parts = vPath.split('/');
                                let current = '/home/pyodide';
                                for (let i = 0; i < parts.length - 1; i++) {
                                    if (!parts[i]) continue;
                                    current += '/' + parts[i];
                                    try { Module.FS.mkdir(current); } catch(e){}
                                }
                                
                                Module.FS.createDataFile('/', targetPath, u8Array, true, true, true);
                            }

                            // Mirror the core entrypoint files onto the fallback layer context 
                            // to satisfy the destructive unpacking checks inside renpy.js
                            if (window.virtualFileSystemMap['main.py']) {
                                try { Module.FS.createDataFile('/', 'main.py', window.virtualFileSystemMap['main.py'], true, true, true); } catch(e){}
                            }

                            console.log("Direct virtual filesystem injection loop finished successfully!");
                        } catch(vfsErr) {
                            console.error("Critical VFS injection exception: ", vfsErr);
                        }
                    }],
                    postRun: [function() {
                        console.log("WebAssembly runtime launched successfully.");
                        try { Module.FS.chdir('/home/pyodide'); } catch(e){}
                    }]
                };
                window.Module.filePackagePrefixURL = window.location.origin + "/";

                window.Module.ENV = {
                    "HOME": "/home/pyodide",
                    "PYTHONPATH": "/home/pyodide"
                };

                setTimeout(() => {
                    progressBar.style.width = "100%";
                    interactiveUi.style.display = 'none';
                    container.style.display = 'block';

                    const renpyEngineScript = document.createElement('script');
                    renpyEngineScript.src = window.location.origin + "/renpy.js";
                    document.body.appendChild(renpyEngineScript);
                }, 500);

            } catch (err) {
                alert("Error during virtualization: " + err.message);
                console.error("Tracking virtualization crash context: ", err);
            }
        }
    </script>
</body>
</html>

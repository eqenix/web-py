services:
  - type: web
    name: client-zip-player
    env: static
    buildCommand: ""
    publishDir: "."
    headers:
      - path: "/*"
        name: "Cross-Origin-Opener-Policy"
        value: "same-origin"
      - path: "/*"
        name: "Cross-Origin-Embedder-Policy"
        value: "require-corp"
